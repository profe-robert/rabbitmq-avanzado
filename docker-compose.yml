version: '3.9'

services:
  # Primer nodo del cluster RabbitMQ
  rabbitmq-1:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq-1
    hostname: rabbitmq-1
    ports:
      - "5672:5672"    # Puerto AMQP para clientes/aplicaciones
      - "15672:15672"  # Consola web de administración (Management UI)
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_ERLANG_COOKIE: "secret_cookie_value" # Cookie compartida para autenticación del cluster
    volumes:
      - rabbitmq_data_1:/var/lib/rabbitmq            # Persistencia de datos del nodo 1
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro # Configuración de clustering montada en solo lectura
    networks:
      - rabbitmq_cluster

  # Segundo nodo del cluster RabbitMQ
  rabbitmq-2:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq-2
    hostname: rabbitmq-2
    ports:
      - "5673:5672"    # Puerto AMQP mapeado al puerto 5673 del host para evitar colisiones
      - "15673:15672"  # Consola web de administración mapeada al puerto 15673 del host
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
      RABBITMQ_ERLANG_COOKIE: "secret_cookie_value" # Debe ser exactamente la misma cookie que en rabbitmq-1
    volumes:
      - rabbitmq_data_2:/var/lib/rabbitmq            # Persistencia de datos del nodo 2
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    networks:
      - rabbitmq_cluster
    depends_on:
      - rabbitmq-1 # Asegura que rabbitmq-1 inicie antes que rabbitmq-2

# Volúmenes persistentes nombrados
volumes:
  rabbitmq_data_1:
  rabbitmq_data_2:

# Red interna tipo bridge que permite la resolución DNS por nombre de contenedor/hostname
networks:
  rabbitmq_cluster:
    driver: bridge